<!doctype html>
<!-- Portada del repositorio (docs/portada.png, 1280x640: también sirve de imagen para compartir el link).
     Se regenera con: bash scripts/portada_repo.sh -->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; font-weight: 900; src: url(../public/fuentes/inter-latin-900-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 700; src: url(../public/fuentes/inter-latin-700-normal.woff2); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif; color: #fff;
    background: radial-gradient(ellipse at 20% 15%, #1d2447 0%, #0d1024 55%, #07080f 100%);
    position: relative;
  }
  .texto { position: absolute; left: 72px; top: 92px; width: 560px; }
  .marca { font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; color: #5CC8FF; }
  h1 { font-weight: 900; font-size: 76px; line-height: 1.02; margin-top: 22px; letter-spacing: -.02em; }
  h1 span { color: #FFC94D; }
  p { font-weight: 700; font-size: 25px; line-height: 1.4; color: #c9cde0; margin-top: 26px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
  .chip { font-weight: 700; font-size: 17px; padding: 8px 15px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); }
  .chip b { color: #2ED47A; }
  .foto { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.12); }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tv { left: 650px; top: 86px; width: 470px; height: 264px; transform: rotate(-3deg); }
  .reel { left: 1040px; top: 150px; width: 190px; height: 338px; transform: rotate(4deg); }
  .anim { left: 700px; top: 380px; width: 330px; height: 186px; transform: rotate(2deg); }
  .anim img { object-position: 100% 50%; }
</style>
</head>
<body>
  <div class="texto">
    <div class="marca">claude-video-editor</div>
    <h1>Grabas.<br><span>Claude edita.</span></h1>
    <p>Subtítulos karaoke, escenas animadas, música original y audio masterizado. Todo en tu Mac, gratis.</p>
    <div class="chips">
      <div class="chip"><b>●</b> 60 fps</div>
      <div class="chip">16:9 · 9:16 · 1:1</div>
      <div class="chip">25 escenas</div>
      <div class="chip">179 pruebas</div>
    </div>
  </div>
  <div class="foto tv"><img src="tv.jpg"></div>
  <div class="foto anim"><img src="animaciones.jpg"></div>
  <div class="foto reel"><img src="reel.jpg"></div>
</body>
</html>
